[project]
name = "gnomoji"
version = "0.3.2"
description = "Gnomoji: double-tap right Shift to pick an emoji, for GNOME on Wayland"
license = "MIT"
requires-python = ">=3.12"
dependencies = []  # runtime deps come from apt; see README

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
