[project]
name = "emoji-picker"
version = "0.2.1"
description = "Double-tap right Shift emoji picker for GNOME on Wayland"
license = "MIT"
requires-python = ">=3.12"
dependencies = []  # runtime deps come from apt; see README

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
