<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Process-only fontconfig override (see fonts.py: use_fast_emoji_font).

  On at least one dev machine, a user-installed COLRv1 *vector* "Noto Color
  Emoji" (typically named NotoColorEmoji-Regular.ttf, e.g. under
  /usr/local/share/fonts/) sorts ahead of Ubuntu's apt CBDT *bitmap*
  NotoColorEmoji.ttf. GTK/Pango's first layout of each distinct glyph in the
  vector font costs ~50ms; with ~1,900 emoji in the picker that blocks the
  GTK main loop for minutes, and the window never appears. The apt bitmap
  font is ~250x faster.

  This file rejects that specific upstream filename wherever it's installed,
  while never matching Ubuntu's own NotoColorEmoji.ttf (no "-Regular" in that
  name), so fontconfig falls back to the fast bitmap font for our process.
  Nothing outside this repo is touched: no system file is edited, and no
  other process is affected. See fonts.py for how this file is activated.
-->
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <!-- Generic: matches the upstream vector release at any install path. -->
      <glob>*/NotoColorEmoji-Regular.ttf</glob>
      <!-- Explicit: the usual hand-install location, kept for clarity. -->
      <glob>/usr/local/share/fonts/NotoColorEmoji-Regular.ttf</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
